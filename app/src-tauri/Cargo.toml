[package]
name = "rusty-steamless-app"
version = "0.0.1"
description = "Rusty-Steamless Tauri GUI."
edition = "2021"
rust-version = "1.85"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/notwinterdust/Rusty-Steamless"

[lib]
name = "rusty_steamless_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusty-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
